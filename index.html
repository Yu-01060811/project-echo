<!DOCTYPE html>
  <html lang="zh-CN">
    <head>
      <title>PROJECT ECHO | ECHO-7</title>
      <style>
        body {
          background-color: #111111;
          color: white;
          font-family: monospace;
          margin: 0;
          min-height: 100vh;
        }
        .computer {
          background-color: #000000;
          border: 8px solid #30303A;
          border-radius: 12px;
          padding: 12px;
          width: calc(100vw - 32px);
          height: calc(100vh - 32px);
          box-sizing: border-box;
          margin: 16px auto;
        }
        .screen {
          background-color: #0000AA;
          color: white;
          border: 3px solid #000000;
          padding: 24px;
          height: 100%;
          box-sizing: border-box;
          position: relative;
          overflow: hidden;
           background-image:
             repeating-linear-gradient(
               to bottom,
               transparent 0px,
               transparent 3px,
               rgba(0, 0, 0, 0.12) 4px
             );
        }
        #system-status {
          color: white;
          border: 1px solid white;
          padding: 8px;
          animation: status-flicker 4s infinite;
        }
       #game-menu {
         position: absolute;
         top: 50%;
         left: 50%;
         transform: translate(-50%, -50%);
         width: min(440px, calc(100% - 48px));
         box-sizing: border-box;
         padding: 30px;
         background-color: rgba(0, 0, 55, 0.96);
         border: 2px solid white;
         box-shadow: 8px 8px 0 #000044;
         display: flex;
         flex-direction: column;
         gap: 18px;
       }
        #game-menu[hidden] {
          display: none;
        }
        #game-menu button {
          width: 100%;
          min-height: 58px;
          padding: 14px;
          font-size: 18px;
          letter-spacing: 2px;
          background-color: #000088;
          border: 2px solid white;
        }
        #game-menu button:last-child {
          background-color: #000044;
          border-color: #9999CC;
          margin-top: 8px;
        }

        #game-menu button:hover {
          background-color: #4444AA;
          color: white;
          border-color: #AAAAFF;
        }
        
        button {
          background-color: #000066;
          color: white;
          border: 2px solid white;
          padding: 12px 18px;
          font-family: monospace;
          font-size: 15px;
          cursor: pointer;
        }
        button:hover {
          background-color: white;
          color: #0000AA;
        }

      @keyframes status-flicker {
        0%, 19%, 21%, 23%, 80%, 100% {
          opacity: 1;
        }
        20%, 22%, 81% {
          opacity: 0.45;
        }
      }
      </style>
    </head>
        <body>
          <div class="computer">
            <div class="screen">
              <h1>PROJECT ECHO</h1>
              <p id="system-status">SYSTEM ONLINE</p>
              <p>Research Station ECHO</p>
              <div id="incident-log">
                <p>--------------------------------</p>
                <p>STATION LOG // ENTRY 07</p>
                <p>STATUS: DATA CORRUPTED</p>
                <p>LAST RECORD: 03:17:42</p>
                <p>--------------------------------</p>
                <p>WARNING: 1 FILE RECOVERED</p>
                <p>ACCESS RESTRICTED.</p>
              </div>
              <button id="start-button">START GAME</button>
              <div id="game-menu" hidden>
                <button>NEW GAME</button>
                <button>CONTINUE</button>
                <button>LANGUAGE</button>
                <button id="back-button">BACK</button>
              </div>
            </div>
          </div>
          <script>
            console.log("SYSTEM ONLINE");
            const startButton = document.getElementById("start-button");
            const gameMenu = document.getElementById("game-menu");
            const backButton = document.getElementById("back-button");
            startButton.addEventListener("click", function () {
              gameMenu.hidden = false;
              startButton.hidden = true;
            });
            backButton.addEventListener("click", function () {
              gameMenu.hidden = true;
              startButton.hidden = false;
            });
          </script>
        </body>
</html>
