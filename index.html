<!DOCTYPE html>
  <html lang="zh-CN">
    <head>
      <title>PROJECT ECHO | ECHO-7</title>
      <style>
        body {
          background-color: #111111;
          color: white;
          font-family: monospace;
        }
        .computer {
          background-color: #000000;
          border: 8px solid #222222;
          border-radius: 12px;
          padding: 12px;
          max-width: 700px;
          margin: 40px auto;
        }
        .screen {
          background-color: #0000AA;
          color: white;
          border: 3px solid #000000;
          padding: 24px;
          height: 420px;
          box-sizing: border-box;
          position: relative;
          overflow: hidden;
        }
        #system-status {
          color: white;
          border: 1px solid white;
          padding: 8px;
          animation: status-flicker 4s infinite;
        }
        #game-menu {
          position: absolute;
          top: 210px;
          left: 24px;
          right: 24px;
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        #game-menu[hidden] {
          display: none;
        }
        button {
          background-color: #000066;
          color: white;
          border: 2px solid white;
          padding: 12px 18px;
          font-family: monospace;
          font-size: 15px;
          cursor: pointer;
        }
        button:hover {
          background-color: white;
          color: #0000AA;
        }

      @keyframes status-flicker {
        0%, 19%, 21%, 23%, 80%, 100% {
          opacity: 1;
        }
        20%, 22%, 81% {
          opacity: 0.45;
        }
      }
      </style>
    </head>
        <body>
          <div class="computer">
            <div class="screen">
              <h1>PROJECT ECHO</h1>
              <p id="system-status">SYSTEM ONLINE</p>
              <p>Research Station ECHO</p>
              <div id="incident-log">
                <p>--------------------------------</p>
                <p>STATION LOG // ENTRY 07</p>
                <p>STATUS: DATA CORRUPTED</p>
                <p>LAST RECORD: 03:17:42</p>
                <p>--------------------------------</p>
                <p>WARNING: 1 FILE RECOVERED</p>
                <p>ACCESS RESTRICTED.</p>
              </div>
              <button id="start-button">START GAME</button>
              <div id="game-menu" hidden>
                <button>NEW GAME</button>
                <button>CONTINUE</button>
                <button>LANGUAGE</button>
                <button id="back-button">BACK</button>
              </div>
            </div>
          </div>
          <script>
            console.log("SYSTEM ONLINE");
            const startButton = document.getElementById("start-button");
            const gameMenu = document.getElementById("game-menu");
            const backButton = document.getElementById("back-button");
            startButton.addEventListener("click", function () {
              gameMenu.hidden = false;
              startButton.hidden = true;
            });
            backButton.addEventListener("click", function () {
              gameMenu.hidden = true;
              startButton.hidden = false;
            });
          </script>
        </body>
</html>
